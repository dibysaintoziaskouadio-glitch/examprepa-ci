server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # API (photos de copies : 4 Mo maximum côté serveur)
  location /api/ {
    proxy_pass http://api:4300;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 5m;
  }

  # Le service worker et le manifeste ne doivent jamais être mis en cache : sinon les mises à jour n'arrivent pas.
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /push-sw.js { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }
  location = /index.html { add_header Cache-Control "no-cache"; }

  # Fichiers versionnés par Vite : cache long
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  # Application monopage
  location / { try_files $uri /index.html; }
}
